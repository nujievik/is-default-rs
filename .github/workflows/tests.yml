name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env: 
  CARGO_TERM_COLOR: always

jobs:
  stable-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        features: ["", "default", "derive", "std"]

    steps:
      - uses: actions/checkout@v4
      - run: rustup update

      - run: cargo test -v --no-default-features --features "${{ matrix['features'] }}"
      - run: cargo test -v --no-default-features --features "${{ matrix['features'] }}" --release


  nightly-tests:
     runs-on: ubuntu-latest

     strategy:
      matrix:
        features: ["nightly", "default,nightly", "derive,nightly", "std,nightly"]

     steps:
       - uses: actions/checkout@v4
       - run: rustup update nightly && rustup default nightly

       - run: cargo test -v --no-default-features --features "${{ matrix['features'] }}"
       - run: cargo test -v --no-default-features --features "${{ matrix['features'] }}" --release


  no-std-builds:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-none

    strategy:
      matrix:
        features: ["", "derive"]

    steps:
      - uses: actions/checkout@v4
      - run: rustup update

      - run: |
          rustup target add ${{ env.TARGET }}
          cargo build -v --no-default-features --features "${{ matrix['features'] }}" --target ${{ env.TARGET }}
          cargo build -v --no-default-features --features "${{ matrix['features'] }}" --target ${{ env.TARGET }} --release
